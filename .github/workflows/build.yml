name: Native Linux shell

on:
  push:
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          arch: gcc_64
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++ libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 dbus catch2
      - name: Configure
        run: |
          build_dir="$(mktemp -d)"
          install_prefix="$(mktemp -d)"
          echo "ADRENALIN_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"
          echo "ADRENALIN_INSTALL_PREFIX=$install_prefix" >> "$GITHUB_ENV"
          cmake -S . -B "$build_dir" -G Ninja -DCMAKE_INSTALL_PREFIX="$install_prefix"
      - name: Build
        run: cmake --build "$ADRENALIN_BUILD_DIR" --parallel
      - name: Test
        run: ctest --test-dir "$ADRENALIN_BUILD_DIR" --output-on-failure
      - name: Install and verify service activation path
        run: |
          cmake --install "$ADRENALIN_BUILD_DIR"
          service_file="$(find "$ADRENALIN_INSTALL_PREFIX" -type f -name 'org.adrenalinlinux.Session1.service' -print -quit)"
          test -n "$service_file"
          service_exec="$(sed -n 's/^Exec=//p' "$service_file")"
          test -n "$service_exec"
          test -x "$service_exec"
          user_unit="$(find "$ADRENALIN_INSTALL_PREFIX" -type f -name 'adrenalin-sessiond.service' -print -quit)"
          test -n "$user_unit"
          unit_exec="$(sed -n 's/^ExecStart=//p' "$user_unit")"
          test -n "$unit_exec"
          test -x "$unit_exec"
